name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shopcare
          POSTGRES_PASSWORD: shopcare
          POSTGRES_DB: shopcare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shopcare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://shopcare:shopcare@localhost:5432/shopcare_test
      DIRECT_URL: postgresql://shopcare:shopcare@localhost:5432/shopcare_test
      TEST_DATABASE_URL: postgresql://shopcare:shopcare@localhost:5432/shopcare_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Migrate database
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (unit + integration)
        run: npm test

      - name: Build (Netlify adapter)
        run: npm run build
