# Shopify Flow trigger (staff alert): a customer paid their repair quote's
# invoice, which accepts the quote; the repair has started. No customer
# reference, so it fires for guests too: add Flow's "Send internal email".
[[extensions]]
name = "Repair quote paid"
uid = "c1f6873f-4a82-4be0-95cf-fa7e2e686952fcb15585"
type = "flow_trigger"
handle = "shopcare-quote-paid"
description = "A customer paid (accepted) their repair quote."

  [settings]

    [[settings.fields]]
    type = "single_line_text_field"
    key = "Ticket number"

    [[settings.fields]]
    type = "single_line_text_field"
    key = "Product title"

    [[settings.fields]]
    type = "single_line_text_field"
    key = "Customer name"

    [[settings.fields]]
    type = "email"
    key = "Customer email"

    [[settings.fields]]
    type = "single_line_text_field"
    key = "Quote total"

    [[settings.fields]]
    type = "single_line_text_field"
    key = "Order name"
