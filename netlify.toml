# Netlify build and runtime config for ShopCare v2.
# The React Router SSR handler is generated by @netlify/vite-plugin-react-router
# (vite.config.ts) as a Netlify Function, so it needs no entry here.
# https://docs.netlify.com/frameworks/react-router/

[build]
  # Runs pending migrations with DIRECT_URL (Neon's unpooled endpoint), then builds.
  command = "npm run build:netlify"
  publish = "build/client"

[build.environment]
  NODE_VERSION = "22"

[functions]
  # Our own functions (jobs-background and the scheduled ones; their cron
  # schedules are in each file's `config`). The SSR function is
  # written by the Vite plugin to .netlify/v1/functions.
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Prisma's query engine is a native library that esbuild doesn't trace; ship it
  # (and the schema) with every function.
  included_files = [
    "node_modules/.prisma/client/libquery_engine-rhel-openssl-3.0.x.so.node",
    "node_modules/.prisma/client/schema.prisma",
  ]

# Deploy previews and branch deploys must not migrate the production database.
# Give them their own DATABASE_URL/DIRECT_URL (a Neon branch) in the Netlify UI,
# scoped to the "Deploy Previews" and "Branch deploys" contexts.
